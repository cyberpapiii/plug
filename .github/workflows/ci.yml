name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI never debugs these binaries. Omitting DWARF materially reduces compile,
  # link, cache, and upload time without changing the code under test.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: -Dwarnings
  MSRV: "1.88.0"

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      app: ${{ steps.paths.outputs.app }}
      e2e: ${{ steps.paths.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        name: Decide which validation lanes are needed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Rules live in scripts/classify-changes.sh so the local `scripts/dev.sh`
        # gate runs exactly the lanes this job would demand.
        run: ./scripts/classify-changes.sh "${BASE_SHA}" "${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  check:
    name: Check (fmt + clippy)
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: MSRV check (1.88.0)
    needs: classify
    if: needs.classify.outputs.rust == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  test-linux:
    name: Test (ubuntu)
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  browser-oauth:
    name: Browser OAuth
    needs: classify
    if: needs.classify.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p plug-mcp -p plug-test-harness --bins
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  test-macos:
    name: Test (macos)
    needs: classify
    # Duplicate of Test (ubuntu) except for macOS cfg. Catch that on main,
    # not on every PR; Plug.app covers Swift and the bundled daemon.
    if: needs.classify.outputs.rust == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-macos-app:
    name: Test (Plug.app)
    needs: classify
    if: needs.classify.outputs.app == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: plug-app-ci
      - run: brew install xcodegen
      - run: swift test --package-path PlugApp/PlugIPC
      - run: ./scripts/check-app-architecture.sh
      - run: xcodegen generate --spec PlugApp/project.yml
      # This gate proves the complete app and login-service bundle compile
      # together, then runs the PlugApp unit suite. The signed fixture class
      # needs a Developer ID host bundle and an embedded SMAppService, which
      # GitHub's ephemeral runner cannot provide, so it is skipped here and
      # runs in the release build instead.
      - run: >-
          xcodebuild build
          -project PlugApp/PlugApp.xcodeproj
          -scheme PlugApp
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO
      # The unit suite compares the host bundle version against the embedded
      # daemon, so the test build carries the workspace version like a release.
      - name: Read workspace release version
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(cargo metadata --no-deps --format-version 1 | \
            python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "plug-mcp"))')"
          echo "WORKSPACE_VERSION=${workspace_version}" >> "$GITHUB_ENV"
      - run: >-
          xcodebuild test
          -project PlugApp/PlugApp.xcodeproj
          -scheme PlugApp
          -destination 'platform=macOS'
          -only-testing:PlugAppTests
          -skip-testing:PlugAppTests/UnifiedReconciliationFixtureTests
          CODE_SIGNING_ALLOWED=NO
          MARKETING_VERSION="$WORKSPACE_VERSION"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

  cross-check:
    name: Cross-check (${{ matrix.target }})
    needs: classify
    if: needs.classify.outputs.rust == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target ${{ matrix.target }}

  binary-size:
    name: Binary size gate
    needs: classify
    if: needs.classify.outputs.rust == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p plug-mcp
      - name: Check binary size < 11 MiB
        run: |
          SIZE=$(stat --format=%s target/release/plug)
          echo "Binary size: $SIZE bytes ($(( SIZE / 1024 / 1024 )) MB)"
          # v0.5 adds the operator API and modern-protocol bridge. Keep a tight
          # regression ceiling above its 10.1 MiB optimized Linux baseline.
          if [ "$SIZE" -gt 11534336 ]; then
            echo "::error::Binary size ${SIZE} exceeds 11 MiB limit"
            exit 1
          fi

  deny:
    name: cargo deny
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
