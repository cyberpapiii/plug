name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI never debugs these binaries. Omitting DWARF materially reduces compile,
  # link, cache, and upload time without changing the code under test.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: -Dwarnings

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      app: ${{ steps.paths.outputs.app }}
      e2e: ${{ steps.paths.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        name: Decide which validation lanes are needed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Rules live in scripts/classify-changes.sh so the local `scripts/dev.sh`
        # gate runs exactly the lanes this job would demand.
        run: ./scripts/classify-changes.sh "${BASE_SHA}" "${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  check:
    name: Check (fmt + clippy)
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: Test (ubuntu)
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  browser-oauth:
    name: Browser OAuth
    needs: classify
    if: needs.classify.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p plug-mcp -p plug-test-harness --bins
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  test-macos-app:
    name: Test (Plug.app)
    needs: classify
    if: needs.classify.outputs.app == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: plug-app-ci
      - run: brew install xcodegen
      - run: swift test --package-path PlugApp/PlugIPC
      - run: ./scripts/check-app-architecture.sh
      # scripts/test-app.sh generates the project and runs the unit suite with
      # the workspace version the suite expects. It is the same script
      # scripts/dev.sh runs locally. --unsigned skips the signed fixture class,
      # which needs a Developer ID host bundle that an ephemeral runner cannot
      # provide; that class runs only through scripts/dev.sh on a signed host.
      - run: ./scripts/test-app.sh --unsigned
        env:
          PLUG_APP_BUILD_NUMBER: ${{ github.run_number }}

  ci-complete:
    # One always-running check that branch protection can require. Requiring the
    # lane jobs directly would wedge every pull request that legitimately skips
    # one, which is most of them now that lanes are path-selected.
    name: CI complete
    if: always()
    needs:
      - classify
      - check
      - test-linux
      - browser-oauth
      - test-macos-app
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any lane failed or was cancelled
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          bad=$(jq -r 'to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | map("\(.key): \(.value.result)")
            | join(", ")' <<<"$RESULTS")
          if [[ -n "$bad" ]]; then
            echo "failing lanes: $bad" >&2
            exit 1
          fi
          echo "all lanes succeeded or were skipped"
