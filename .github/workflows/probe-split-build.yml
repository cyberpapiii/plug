name: Probe split daemon build

on:
  pull_request:

jobs:
  sequential:
    name: Reference (one runner, both targets)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plug-app-universal
          save-if: false
      - run: |
          set -euo pipefail
          cargo build --release -p plug-mcp --target aarch64-apple-darwin
          cargo build --release -p plug-mcp --target x86_64-apple-darwin
          lipo -create target/aarch64-apple-darwin/release/plug target/x86_64-apple-darwin/release/plug -output target/plug-universal
          shasum -a 256 target/aarch64-apple-darwin/release/plug target/x86_64-apple-darwin/release/plug target/plug-universal

  build-daemon:
    name: Daemon (${{ matrix.target }})
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plug-app-universal
          save-if: false
      - run: cargo build --release -p plug-mcp --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: daemon-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/plug
          retention-days: 1

  assemble:
    name: Assemble universal daemon
    needs: build-daemon
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: daemon-*
          path: daemons
      - run: |
          set -euo pipefail
          lipo -create daemons/daemon-aarch64-apple-darwin/plug daemons/daemon-x86_64-apple-darwin/plug -output plug-universal
          chmod 755 plug-universal
          lipo -verify_arch plug-universal arm64 x86_64
          test -x plug-universal
          shasum -a 256 daemons/daemon-aarch64-apple-darwin/plug daemons/daemon-x86_64-apple-darwin/plug plug-universal
