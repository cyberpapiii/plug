name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
          # Windows disabled: the daemon uses Unix sockets.

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: contains(matrix.target, 'aarch64-unknown-linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} -p plug-mcp

      # Signing happens before packaging so the archive carries the signed
      # binary. The script fails when a secret is missing rather than emitting
      # an unsigned artifact, so a release can never claim a signature it does
      # not have.
      - name: Sign and notarize (macOS)
        if: contains(matrix.target, 'apple-darwin')
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASS: ${{ secrets.MACOS_CERTIFICATE_PASS }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: ./scripts/sign-macos-release.sh "target/${{ matrix.target }}/release/plug"

      - name: Package cargo-dist-compatible archive
        shell: bash
        run: |
          set -euo pipefail
          archive="plug-mcp-${{ matrix.target }}.tar.gz"
          staging="plug-mcp-${{ matrix.target }}"
          mkdir -p "${staging}"
          cp "target/${{ matrix.target }}/release/plug" "${staging}/"
          cp README.md LICENSE CHANGELOG.md "${staging}/"
          tar czf "${archive}" "${staging}"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      # The signature lives inside the Mach-O image, so archiving should carry
      # it through. Verify rather than assume: a packaging change that strips it
      # would otherwise only surface on a user's machine.
      - name: Verify the signature survived packaging (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          check_dir="$(mktemp -d)"
          tar xzf "${ARCHIVE}" -C "${check_dir}"
          codesign --verify --strict --verbose=2 \
            "${check_dir}/plug-mcp-${{ matrix.target }}/plug"
          rm -rf "${check_dir}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  build-app:
    name: Build Plug.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read workspace release version
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(cargo metadata --no-deps --format-version 1 | \
            python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "plug-mcp"))')"
          echo "WORKSPACE_VERSION=${workspace_version}" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: plug-app-universal

      - name: Build universal daemon
        run: |
          set -euo pipefail
          cargo build --release -p plug-mcp --target aarch64-apple-darwin
          cargo build --release -p plug-mcp --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/plug \
            target/x86_64-apple-darwin/release/plug \
            -output target/plug-universal
          lipo -archs target/plug-universal

      - name: Build app archive
        run: |
          set -euo pipefail
          cd PlugApp
          xcodegen generate
          xcodebuild archive \
            -project PlugApp.xcodeproj \
            -scheme PlugApp \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Plug.xcarchive" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$WORKSPACE_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            PLUG_RELEASE_BINARY="$GITHUB_WORKSPACE/target/plug-universal"

      - name: Sign, notarize, and staple app DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASS: ${{ secrets.MACOS_CERTIFICATE_PASS }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          ./scripts/sign-notarize-macos-app.sh \
            "$RUNNER_TEMP/Plug.xcarchive/Products/Applications/Plug.app" \
            "$RUNNER_TEMP/Plug-${WORKSPACE_VERSION}.dmg"

      - name: Generate Homebrew Cask
        shell: bash
        run: |
          set -euo pipefail
          app_dmg="Plug-${WORKSPACE_VERSION}.dmg"
          app_sha="$(shasum -a 256 "$RUNNER_TEMP/$app_dmg" | cut -d' ' -f1)"
          cat > "$RUNNER_TEMP/plug-app.rb" <<EOF
          cask "plug-app" do
            version "${WORKSPACE_VERSION}"
            sha256 "${app_sha}"

            url "https://github.com/cyberpapiii/plug/releases/download/${GITHUB_REF_NAME}/${app_dmg}"
            name "Plug"
            desc "Calm macOS control surface for the Plug MCP multiplexer"
            homepage "https://github.com/cyberpapiii/plug"

            auto_updates true
            depends_on macos: ">= :sonoma"
            app "Plug.app"
          end
          EOF
          ruby -c "$RUNNER_TEMP/plug-app.rb"

      - name: Generate signed Sparkle appcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY"
          mkdir -p "$RUNNER_TEMP/appcast-source" "$RUNNER_TEMP/sparkle-tools"
          gh release download --repo cyberpapiii/plug --pattern appcast.xml \
            --dir "$RUNNER_TEMP/appcast-source" 2>/dev/null || true
          cp "$RUNNER_TEMP"/Plug-*.dmg "$RUNNER_TEMP/appcast-source/"
          gh release download 2.9.2 --repo sparkle-project/Sparkle \
            --pattern Sparkle-2.9.2.tar.xz --dir "$RUNNER_TEMP/sparkle-tools"
          tar -xJf "$RUNNER_TEMP/sparkle-tools/Sparkle-2.9.2.tar.xz" \
            -C "$RUNNER_TEMP/sparkle-tools"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast" \
              --ed-key-file - \
              --maximum-versions 0 \
              --download-url-prefix "https://github.com/cyberpapiii/plug/releases/download/${TAG}/" \
              --link "https://github.com/cyberpapiii/plug" \
              "$RUNNER_TEMP/appcast-source"
          cp "$RUNNER_TEMP/appcast-source/appcast.xml" "$RUNNER_TEMP/appcast.xml"

      - name: Verify release version contract
        shell: bash
        run: |
          ./scripts/verify-release-contract.sh \
            --tag "$GITHUB_REF_NAME" \
            --app "$RUNNER_TEMP/Plug.xcarchive/Products/Applications/Plug.app" \
            --appcast "$RUNNER_TEMP/appcast.xml" \
            --cask "$RUNNER_TEMP/plug-app.rb"

      - name: Upload app release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plug-app
          path: |
            ${{ runner.temp }}/Plug-*.dmg
            ${{ runner.temp }}/appcast.xml
            ${{ runner.temp }}/plug-app.rb

  publish:
    name: Publish GitHub release and Homebrew tap
    needs: [build, build-app]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binary archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: archive-*
          merge-multiple: true

      - name: Download app DMG
        uses: actions/download-artifact@v4
        with:
          name: plug-app
          path: artifacts

      - name: Install cargo-dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build global cargo-dist artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/distrib
          cp artifacts/plug-mcp-*.tar.gz target/distrib/
          dist build --artifacts=global --tag "$TAG" --allow-dirty
          cp target/distrib/plug-mcp-installer.sh artifacts/
          cp target/distrib/source.tar.gz artifacts/
          cp target/distrib/source.tar.gz.sha256 artifacts/

      - name: Generate Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          arm_macos_sha=$(sha256sum plug-mcp-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          intel_macos_sha=$(sha256sum plug-mcp-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          arm_linux_sha=$(sha256sum plug-mcp-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          intel_linux_sha=$(sha256sum plug-mcp-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          version="${TAG#v}"
          cat > plug.rb <<EOF
          class Plug < Formula
            desc "MCP multiplexer - one config, every AI client connected, every server shared"
            homepage "https://github.com/cyberpapiii/plug"
            version "${version}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/cyberpapiii/plug/releases/download/${TAG}/plug-mcp-aarch64-apple-darwin.tar.gz"
                sha256 "${arm_macos_sha}"
              else
                url "https://github.com/cyberpapiii/plug/releases/download/${TAG}/plug-mcp-x86_64-apple-darwin.tar.gz"
                sha256 "${intel_macos_sha}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/cyberpapiii/plug/releases/download/${TAG}/plug-mcp-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${arm_linux_sha}"
              else
                url "https://github.com/cyberpapiii/plug/releases/download/${TAG}/plug-mcp-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${intel_linux_sha}"
              end
            end

            def install
              bin.install "plug"
            end

            test do
              assert_match "plug ${version}", shell_output("#{bin}/plug --version")
            end
          end
          EOF
          ruby -c plug.rb

          ruby -c plug-app.rb

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum \
            plug-mcp-*.tar.gz \
            Plug-*.dmg \
            source.tar.gz \
            source.tar.gz.sha256 \
            plug-mcp-installer.sh \
            plug.rb \
            plug-app.rb \
            appcast.xml > checksums.sha256
          cat checksums.sha256

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub release
        shell: bash
        run: |
          gh release create "$TAG" \
            --title "plug $TAG" \
            --notes-file RELEASE_NOTES.md \
            artifacts/plug-mcp-*.tar.gz \
            artifacts/source.tar.gz \
            artifacts/source.tar.gz.sha256 \
            artifacts/plug-mcp-installer.sh \
            artifacts/plug.rb \
            artifacts/plug-app.rb \
            artifacts/Plug-*.dmg \
            artifacts/appcast.xml \
            artifacts/checksums.sha256

      - name: Publish Homebrew formula
        uses: actions/checkout@v4
        with:
          repository: cyberpapiii/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Commit Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/plug.rb homebrew-tap/plug.rb
          mkdir -p homebrew-tap/Casks
          cp artifacts/plug-app.rb homebrew-tap/Casks/plug-app.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plug.rb Casks/plug-app.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date"
          else
            git commit -m "plug ${TAG#v}"
            git push
          fi
