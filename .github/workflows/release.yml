name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-app:
    name: Build Plug.app
    # Liquid Glass is compiled behind `#if compiler(>=6.2)`. macOS 15 runners
    # use an older Xcode and silently ship the fallback interface instead.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Verify Liquid Glass toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swiftc -version | grep -Eq 'Apple Swift version (6\.[2-9]|[7-9]\.)'

      - name: Read workspace release version
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(cargo metadata --no-deps --format-version 1 | \
            python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "plug-mcp"))')"
          echo "WORKSPACE_VERSION=${workspace_version}" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # A cache saved on one tag is invisible to the next tag, so a release
      # build could never hit its own cache. The warm-release-cache job in
      # ci.yml saves this same key from main after every merge; restore it
      # here and never save (a tag-scoped save would only be dead weight).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plug-app-universal
          save-if: false

      - name: Build universal daemon
        run: |
          set -euo pipefail
          cargo build --release -p plug-mcp --target aarch64-apple-darwin
          cargo build --release -p plug-mcp --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/plug \
            target/x86_64-apple-darwin/release/plug \
            -output target/plug-universal
          lipo -archs target/plug-universal

      - name: Build app archive
        run: |
          set -euo pipefail
          cd PlugApp
          xcodegen generate
          xcodebuild archive \
            -project PlugApp.xcodeproj \
            -scheme PlugApp \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Plug.xcarchive" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$WORKSPACE_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            PLUG_RELEASE_BINARY="$GITHUB_WORKSPACE/target/plug-universal"

      - name: Sign, notarize, and staple app DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASS: ${{ secrets.MACOS_CERTIFICATE_PASS }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          ./scripts/sign-notarize-macos-app.sh \
            "$RUNNER_TEMP/Plug.xcarchive/Products/Applications/Plug.app" \
            "$RUNNER_TEMP/Plug-${WORKSPACE_VERSION}.dmg"

      - name: Generate Homebrew Cask
        shell: bash
        run: |
          set -euo pipefail
          app_dmg="Plug-${WORKSPACE_VERSION}.dmg"
          app_sha="$(shasum -a 256 "$RUNNER_TEMP/$app_dmg" | cut -d' ' -f1)"
          ./scripts/generate-release-metadata.sh \
            --version "$WORKSPACE_VERSION" \
            --dmg-sha "$app_sha" \
            --output "$RUNNER_TEMP"
          ruby -c "$RUNNER_TEMP/plug-app.rb"

      - name: Generate signed Sparkle appcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY"
          mkdir -p "$RUNNER_TEMP/appcast-source" "$RUNNER_TEMP/sparkle-tools"
          latest_release_error="$RUNNER_TEMP/latest-release-error"
          if latest_release_tag="$(gh api 'repos/cyberpapiii/plug/releases/latest' \
            --jq '.tag_name // ""' 2>"$latest_release_error")"; then
            :
          elif grep -Eiq '404|not found' "$latest_release_error"; then
            latest_release_tag=""
          else
            cat "$latest_release_error" >&2
            exit 1
          fi
          if [[ -n "$latest_release_tag" ]]; then
            gh release download "$latest_release_tag" --repo cyberpapiii/plug \
              --pattern appcast.xml --dir "$RUNNER_TEMP/appcast-source"
            echo "HAS_PUBLISHED_PREDECESSOR=true" >> "$GITHUB_ENV"
          else
            echo "HAS_PUBLISHED_PREDECESSOR=false" >> "$GITHUB_ENV"
          fi
          cp "$RUNNER_TEMP"/Plug-*.dmg "$RUNNER_TEMP/appcast-source/"
          gh release download 2.9.2 --repo sparkle-project/Sparkle \
            --pattern Sparkle-2.9.2.tar.xz --dir "$RUNNER_TEMP/sparkle-tools"
          tar -xJf "$RUNNER_TEMP/sparkle-tools/Sparkle-2.9.2.tar.xz" \
            -C "$RUNNER_TEMP/sparkle-tools"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast" \
              --ed-key-file - \
              --maximum-versions 0 \
              --download-url-prefix "https://github.com/cyberpapiii/plug/releases/download/${TAG}/" \
              --link "https://github.com/cyberpapiii/plug" \
              "$RUNNER_TEMP/appcast-source"
          cp "$RUNNER_TEMP/appcast-source/appcast.xml" "$RUNNER_TEMP/appcast.xml"

      - name: Verify release version contract
        shell: bash
        run: |
          set -euo pipefail
          verify_args=(
            --tag "$GITHUB_REF_NAME"
            --app "$RUNNER_TEMP/Plug.xcarchive/Products/Applications/Plug.app"
            --appcast "$RUNNER_TEMP/appcast.xml"
            --cask "$RUNNER_TEMP/plug-app.rb"
          )
          if [[ "$HAS_PUBLISHED_PREDECESSOR" != true ]]; then
            verify_args+=(--allow-no-history)
          fi
          ./scripts/verify-release-contract.sh "${verify_args[@]}"

      - name: Upload app release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: plug-app
          path: |
            ${{ runner.temp }}/Plug-*.dmg
            ${{ runner.temp }}/appcast.xml
            ${{ runner.temp }}/plug-app.rb

  publish-release:
    name: Publish release
    needs: build-app
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Download app artifacts
        uses: actions/download-artifact@v7
        with:
          name: plug-app
          path: artifacts

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum Plug-*.dmg plug-app.rb appcast.xml > checksums.sha256
          cat checksums.sha256

      # The release notes are the CHANGELOG section for this version, which
      # scripts/release.sh renamed from "Unreleased" when it cut the release.
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { printing = index($0, "## [" v "]") == 1; next }
            printing { print }
          ' CHANGELOG.md > artifacts/RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' artifacts/RELEASE_NOTES.md; then
            echo "CHANGELOG.md has no '## [$version]' section" >&2
            exit 1
          fi
          cat artifacts/RELEASE_NOTES.md

      - name: Checkout Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: cyberpapiii/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish release and update tap
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash ./scripts/publish-release-transaction.sh \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --artifacts-dir artifacts \
            --notes-file artifacts/RELEASE_NOTES.md \
            --tap-dir homebrew-tap
