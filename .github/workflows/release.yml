name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
          # Windows disabled: the daemon uses Unix sockets.

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (ARM musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        if: matrix.target != 'aarch64-unknown-linux-musl'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} -p plug-mcp

      - name: Build ARM musl with cross
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target aarch64-unknown-linux-musl -p plug-mcp

      - name: Verify Linux ELF
        shell: bash
        run: |
          set -euo pipefail
          elf_path="target/${{ matrix.target }}/release/plug"
          [[ -x "$elf_path" ]] || {
            echo "release binary missing or not executable: $elf_path" >&2
            exit 1
          }
          command -v readelf >/dev/null 2>&1 || {
            echo "readelf is required for release ELF verification" >&2
            exit 1
          }
          machine="$(readelf -h "$elf_path" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
          case "${{ matrix.target }}" in
            x86_64-*) expected_machine='Advanced Micro Devices X86-64' ;;
            aarch64-*) expected_machine='AArch64' ;;
            *)
              echo "unsupported Linux release target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac
          [[ "$machine" == "$expected_machine" ]] || {
            echo "unexpected ELF machine for $elf_path: $machine" >&2
            exit 1
          }
          interpreter="$(readelf -l "$elf_path" | \
            sed -n 's/.*Requesting program interpreter: \(.*\)]/\1/p')"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl) expected_interpreter='ld-musl-x86_64.so.1' ;;
            aarch64-unknown-linux-musl) expected_interpreter='ld-musl-aarch64.so.1' ;;
            *) expected_interpreter='' ;;
          esac
          if [[ -n "$expected_interpreter" && -n "$interpreter" && \
            "$interpreter" != *"/$expected_interpreter" ]]; then
            echo "unexpected musl ELF interpreter for $elf_path: $interpreter" >&2
            exit 1
          fi

      - name: Package cargo-dist-compatible archive
        shell: bash
        run: |
          set -euo pipefail
          archive="plug-mcp-${{ matrix.target }}.tar.gz"
          staging="plug-mcp-${{ matrix.target }}"
          mkdir -p "${staging}"
          cp "target/${{ matrix.target }}/release/plug" "${staging}/"
          cp README.md LICENSE CHANGELOG.md "${staging}/"
          tar czf "${archive}" "${staging}"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Upload archive
        uses: actions/upload-artifact@v5
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  build-app:
    name: Build Plug.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Read workspace release version
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(cargo metadata --no-deps --format-version 1 | \
            python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "plug-mcp"))')"
          echo "WORKSPACE_VERSION=${workspace_version}" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: plug-app-universal

      - name: Build universal daemon
        run: |
          set -euo pipefail
          cargo build --release -p plug-mcp --target aarch64-apple-darwin
          cargo build --release -p plug-mcp --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/plug \
            target/x86_64-apple-darwin/release/plug \
            -output target/plug-universal
          lipo -archs target/plug-universal

      - name: Build app archive
        run: |
          set -euo pipefail
          cd PlugApp
          xcodegen generate
          xcodebuild archive \
            -project PlugApp.xcodeproj \
            -scheme PlugApp \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Plug.xcarchive" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$WORKSPACE_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            PLUG_RELEASE_BINARY="$GITHUB_WORKSPACE/target/plug-universal"

      - name: Sign, notarize, and staple app DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASS: ${{ secrets.MACOS_CERTIFICATE_PASS }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          ./scripts/sign-notarize-macos-app.sh \
            "$RUNNER_TEMP/Plug.xcarchive/Products/Applications/Plug.app" \
            "$RUNNER_TEMP/Plug-${WORKSPACE_VERSION}.dmg"

      - name: Generate Homebrew Cask
        shell: bash
        run: |
          set -euo pipefail
          app_dmg="Plug-${WORKSPACE_VERSION}.dmg"
          app_sha="$(shasum -a 256 "$RUNNER_TEMP/$app_dmg" | cut -d' ' -f1)"
          ./scripts/generate-release-metadata.sh \
            --version "$WORKSPACE_VERSION" \
            --dmg-sha "$app_sha" \
            --cask-only \
            --output "$RUNNER_TEMP"
          ruby -c "$RUNNER_TEMP/plug-app.rb"

      - name: Generate signed Sparkle appcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY"
          mkdir -p "$RUNNER_TEMP/appcast-source" "$RUNNER_TEMP/sparkle-tools"
          latest_release_error="$RUNNER_TEMP/latest-release-error"
          if latest_release_tag="$(gh api 'repos/cyberpapiii/plug/releases/latest' \
            --jq '.tag_name // ""' 2>"$latest_release_error")"; then
            :
          elif grep -Eiq '404|not found' "$latest_release_error"; then
            latest_release_tag=""
          else
            cat "$latest_release_error" >&2
            exit 1
          fi
          if [[ -n "$latest_release_tag" ]]; then
            gh release download "$latest_release_tag" --repo cyberpapiii/plug \
              --pattern appcast.xml --dir "$RUNNER_TEMP/appcast-source"
            echo "HAS_PUBLISHED_PREDECESSOR=true" >> "$GITHUB_ENV"
          else
            echo "HAS_PUBLISHED_PREDECESSOR=false" >> "$GITHUB_ENV"
          fi
          cp "$RUNNER_TEMP"/Plug-*.dmg "$RUNNER_TEMP/appcast-source/"
          gh release download 2.9.2 --repo sparkle-project/Sparkle \
            --pattern Sparkle-2.9.2.tar.xz --dir "$RUNNER_TEMP/sparkle-tools"
          tar -xJf "$RUNNER_TEMP/sparkle-tools/Sparkle-2.9.2.tar.xz" \
            -C "$RUNNER_TEMP/sparkle-tools"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast" \
              --ed-key-file - \
              --maximum-versions 0 \
              --download-url-prefix "https://github.com/cyberpapiii/plug/releases/download/${TAG}/" \
              --link "https://github.com/cyberpapiii/plug" \
              "$RUNNER_TEMP/appcast-source"
          cp "$RUNNER_TEMP/appcast-source/appcast.xml" "$RUNNER_TEMP/appcast.xml"

      - name: Verify release version contract
        shell: bash
        run: |
          set -euo pipefail
          verify_args=(
            --tag "$GITHUB_REF_NAME"
            --app "$RUNNER_TEMP/Plug.xcarchive/Products/Applications/Plug.app"
            --appcast "$RUNNER_TEMP/appcast.xml"
            --cask "$RUNNER_TEMP/plug-app.rb"
          )
          if [[ "$HAS_PUBLISHED_PREDECESSOR" != true ]]; then
            verify_args+=(--allow-no-history)
          fi
          ./scripts/verify-release-contract.sh "${verify_args[@]}"

      - name: Upload app release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: plug-app
          path: |
            ${{ runner.temp }}/Plug-*.dmg
            ${{ runner.temp }}/appcast.xml
            ${{ runner.temp }}/plug-app.rb

  prepare-release:
    name: Prepare release assets
    needs: [build-linux, build-app]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download binary archives
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: archive-*
          merge-multiple: true

      - name: Download app DMG
        uses: actions/download-artifact@v5
        with:
          name: plug-app
          path: artifacts

      - name: Install cargo-dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify cargo-dist plan and custom release workflow
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-release-workflow.sh
          dist plan --no-local-paths

      - name: Build global cargo-dist artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/distrib
          cp artifacts/plug-mcp-*.tar.gz target/distrib/
          dist build --artifacts=global --tag "$TAG"
          ./scripts/patch-dist-installer.sh target/distrib/plug-mcp-installer.sh
          cp target/distrib/plug-mcp-installer.sh artifacts/
          cp target/distrib/source.tar.gz artifacts/
          cp target/distrib/source.tar.gz.sha256 artifacts/

      - name: Generate Homebrew Formula
        shell: bash
        run: |
          set -euo pipefail
          app_dmg="$(find artifacts -maxdepth 1 -type f -name 'Plug-*.dmg' -print -quit)"
          test -n "$app_dmg"
          ./scripts/generate-release-metadata.sh \
            --version "${TAG#v}" \
            --dmg-sha "$(sha256sum "$app_dmg" | awk '{print $1}')" \
            --linux-arm-sha "$(sha256sum artifacts/plug-mcp-aarch64-unknown-linux-gnu.tar.gz | awk '{print $1}')" \
            --linux-x64-sha "$(sha256sum artifacts/plug-mcp-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')" \
            --formula-only \
            --output artifacts
          ruby -c artifacts/plug.rb
          ruby -c artifacts/plug-app.rb

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum \
            plug-mcp-*.tar.gz \
            Plug-*.dmg \
            source.tar.gz \
            source.tar.gz.sha256 \
            plug-mcp-installer.sh \
            plug.rb \
            plug-app.rb \
            appcast.xml > checksums.sha256
          cat checksums.sha256

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Verify prepared assets
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/appcast.xml
          test -f artifacts/plug-mcp-installer.sh
          test -n "$(compgen -G 'artifacts/Plug-*.dmg')"
          if command -v xmllint >/dev/null 2>&1; then
            xmllint --noout artifacts/appcast.xml
          fi
          (cd artifacts && sha256sum -c checksums.sha256)
          ruby -c artifacts/plug.rb
          ruby -c artifacts/plug-app.rb

      - name: Include release notes in prepared bundle
        shell: bash
        run: cp RELEASE_NOTES.md artifacts/RELEASE_NOTES.md

      - name: Upload prepared release bundle
        uses: actions/upload-artifact@v5
        with:
          name: prepared-release
          path: artifacts

  publish-release:
    name: Publish release transaction
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Download prepared release bundle
        uses: actions/download-artifact@v5
        with:
          name: prepared-release
          path: artifacts

      - name: Checkout Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: cyberpapiii/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish staged release and tap transaction
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash ./scripts/publish-release-transaction.sh \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --artifacts-dir artifacts \
            --notes-file artifacts/RELEASE_NOTES.md \
            --tap-dir homebrew-tap
