[workspace]
members = ["cargo:plug"]

[dist]
# cargo-dist configuration
cargo-dist-version = "0.31.0"

# GitHub release hosting is orchestrated by the checked-in custom workflow.
# Keep cargo-dist's CI generator disabled so `dist plan --no-local-paths` does
# not silently bless drift between that workflow and cargo-dist's generic one.
ci = []
hosting = ["github"]

# Build targets
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
]

# Installers
installers = ["shell", "homebrew"]

# Homebrew tap
tap = "cyberpapiii/homebrew-tap"

# Publish generated formula updates to the tap during release.
publish-jobs = ["homebrew"]

# Formula name for Homebrew
formula = "plug"

# Shell installer config
install-path = "CARGO_HOME"

# Checksum generation
checksum = "sha256"

# Build settings
build-local-artifacts = true

# Archive format: zip for Windows, tar.gz for everything else
windows-archive = ".zip"
unix-archive = ".tar.gz"

# Auto-include relevant files
include = ["README.md", "CHANGELOG.md", "LICENSE"]

# Package metadata
[dist.dependencies]
# No additional system dependencies required
