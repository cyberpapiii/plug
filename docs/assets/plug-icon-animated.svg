<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Plug">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3d9bff"/>
      <stop offset="1" stop-color="#0a6ee6"/>
    </linearGradient>
  </defs>
  <style>
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 6s infinite, glance 12s ease-in-out infinite; }
    @keyframes blink { 0%, 46%, 50%, 94%, 100% { scale: 1 1; } 48%, 97% { scale: 1.3 0.2; } }
    @keyframes glance { 0%, 58%, 76%, 100% { translate: 0 0; } 62%, 72% { translate: 3.5px 0; } }
    @media (prefers-reduced-motion: reduce) { .eyes { animation: none; } }
  </style>
  <rect width="120" height="120" rx="27" fill="url(#bg)"/>
  <g transform="translate(59.36 56.92) rotate(-10) translate(-60 -55.5)" fill="#fff">
    <rect x="39" y="17" width="14" height="37" rx="7"/>
    <rect x="67" y="17" width="14" height="37" rx="7"/>
    <rect x="24" y="40" width="72" height="54" rx="18"/>
    <g fill="#0a5fd0">
      <rect class="eyes" x="46.88" y="53.86" width="9.24" height="22.28" rx="4.62"/>
      <rect class="eyes" x="71.88" y="53.86" width="9.24" height="22.28" rx="4.62"/>
    </g>
  </g>
</svg>
