<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Clients on the left connect through Plug to servers on the right">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10141b"/><stop offset="1" stop-color="#0c1a2e"/></linearGradient>
  <linearGradient id="plug" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3d9bff"/><stop offset="1" stop-color="#0a6ee6"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .name { font-size: 19px; font-weight: 600; fill: #eef2f7; }
  .head { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #93a1b5; }
  .sub { font-size: 15px; fill: #93a1b5; }
  .wire { fill: none; stroke: #2f3d54; stroke-width: 2; }
  .flow { fill: none; stroke: #4aa8ff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1 26; animation: run 1.6s linear infinite; }
  .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: 600px 254px; }
  @keyframes run { to { stroke-dashoffset: -27; } }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .6; transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
