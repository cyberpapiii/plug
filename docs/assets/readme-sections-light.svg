<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="The four sections of the Plug window: Servers, Clients, Events, Activity">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .t { font-size: 21px; font-weight: 700; fill: #1b2330; }
  .d { font-size: 15px; fill: #5d6b7e; }
</style>
<rect x="1" y="1" width="280" height="188" rx="18" fill="#ffffff" stroke="#d6deea"/><rect x="24" y="24" width="52" height="52" rx="14" fill="#0a6ee6" opacity="0.14"/><g transform="translate(36 35)" fill="none" stroke="#0a6ee6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l10-5 10 5v12l-10 5-10-5z"/><path d="M4 9l10 5 10-5M14 14v12"/></g><text class="t" x="24" y="112">Servers</text><text class="d" x="24" y="138">What provides tools,</text><text class="d" x="24" y="159">and whether it is working</text>
<rect x="307" y="1" width="280" height="188" rx="18" fill="#ffffff" stroke="#d6deea"/><rect x="330" y="24" width="52" height="52" rx="14" fill="#8b5cf6" opacity="0.14"/><g transform="translate(342 35)" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="22" height="16" rx="3"/><path d="M3 10h22M10 25h8"/></g><text class="t" x="330" y="112">Clients</text><text class="d" x="330" y="138">What uses tools, and</text><text class="d" x="330" y="159">what each one may use</text>
<rect x="613" y="1" width="280" height="188" rx="18" fill="#ffffff" stroke="#d6deea"/><rect x="636" y="24" width="52" height="52" rx="14" fill="#f5a524" opacity="0.14"/><g transform="translate(648 35)" fill="none" stroke="#f5a524" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20v-7a7 7 0 0114 0v7l2 3H5z"/><path d="M12 25a2.2 2.2 0 004 0"/></g><text class="t" x="636" y="112">Events</text><text class="d" x="636" y="138">Tell a client when</text><text class="d" x="636" y="159">something happens</text>
<rect x="919" y="1" width="280" height="188" rx="18" fill="#ffffff" stroke="#d6deea"/><rect x="942" y="24" width="52" height="52" rx="14" fill="#17b26a" opacity="0.14"/><g transform="translate(954 35)" fill="none" stroke="#17b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="15" r="11"/><path d="M14 8v7l5 3"/></g><text class="t" x="942" y="112">Activity</text><text class="d" x="942" y="138">Every tool call,</text><text class="d" x="942" y="159">and how it went</text>
