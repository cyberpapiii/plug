[package]
name = "plug-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP multiplexer — one config, every AI client connected, every server shared"

[[bin]]
name = "plug"
path = "src/main.rs"

[dependencies]
plug-core = { path = "../plug-core", version = "0.6.2" }
rmcp.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-util.workspace = true
axum.workspace = true
tower.workspace = true
reqwest.workspace = true
base64.workspace = true
sha2.workspace = true
hmac.workspace = true

# Daemon (Phase 4)
tracing-appender.workspace = true
fs4.workspace = true
subtle.workspace = true
directories.workspace = true
uuid.workspace = true
dashmap.workspace = true
dirs.workspace = true
dialoguer = "0.12.0"
open = "5.3.3"
console = "0.16.2"
serde_norway.workspace = true
figment.workspace = true
toml.workspace = true
axum-server.workspace = true
rustls.workspace = true
oauth2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Safe bindings for NSWorkspace bundle-identifier discovery. Keeping this
# target-scoped preserves the standalone Linux binary and its dependency graph.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false }
plug-test-harness = { path = "../plug-test-harness" }
tokio = { workspace = true, features = ["test-util"] }
